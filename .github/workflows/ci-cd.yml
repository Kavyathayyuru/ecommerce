name: Microservices CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ProductService
            project: ProductService/ProductService.csproj
          - service: OrderService
            project: OrderService/OrderService.csproj
          - service: UserService
            project: UserService/UserService.csproj
          - service: PaymentService
            project: PaymentService/PaymentService.csproj
          - service: Gateway
            project: Gateway/Gateway.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }}

      - name: Build project
        run: dotnet build ${{ matrix.project }} --configuration Release --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-release
          path: |
            ${{ matrix.project }}/bin/Release/

  docker-publish:
    name: Publish Docker images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ProductService
            file: ProductService/Containerfile
            image: product-service
          - service: OrderService
            file: OrderService/Containerfile
            image: order-service
          - service: UserService
            file: UserService/Containerfile
            image: user-service
          - service: PaymentService
            file: PaymentService/Containerfile
            image: payment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

  deploy-kubernetes:
    name: Deploy to Kubernetes
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.KUBE_CONFIG != ''
    needs: docker-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update manifest image tags
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          owner = "${OWNER}".lower()
          sha = "${SHA}"
          path = Path('k8s/microservices.yaml')
          text = path.read_text()
          replacements = {
              'localhost/product-service:1.0': f'ghcr.io/{owner}/product-service:{sha}',
              'localhost/order-service:1.0': f'ghcr.io/{owner}/order-service:{sha}',
              'localhost/user-service:1.0': f'ghcr.io/{owner}/user-service:{sha}',
              'localhost/payment-service:1.0': f'ghcr.io/{owner}/payment-service:{sha}',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Apply Kubernetes manifest
        run: kubectl apply -f k8s/microservices.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/product-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/order-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/user-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/payment-service -n ecommerce --timeout=180s

      - name: Show deployment status
        run: kubectl get pods,services -n ecommerce
