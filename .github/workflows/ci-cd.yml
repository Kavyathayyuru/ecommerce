name: Microservices CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ProductService
            project: ProductService/ProductService.csproj
          - service: OrderService
            project: OrderService/OrderService.csproj
          - service: UserService
            project: UserService/UserService.csproj
          - service: PaymentService
            project: PaymentService/PaymentService.csproj
          - service: Gateway
            project: Gateway/Gateway.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }}

      - name: Build project
        run: dotnet build ${{ matrix.project }} --configuration Release --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-release
          path: |
            ${{ matrix.project }}/bin/Release/

  web-ui-build:
    name: Build Web UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: WebUI/package-lock.json

      - name: Install dependencies
        working-directory: WebUI
        run: npm ci

      - name: Build Web UI
        working-directory: WebUI
        run: npm run build

      - name: Upload Web UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebUI-release
          path: WebUI/dist/

  docker-publish:
    name: Publish Docker images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build, web-ui-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ProductService
            file: ProductService/Containerfile
            image: product-service
          - service: OrderService
            file: OrderService/Containerfile
            image: order-service
          - service: UserService
            file: UserService/Containerfile
            image: user-service
          - service: PaymentService
            file: PaymentService/Containerfile
            image: payment-service
          - service: Gateway
            file: Gateway/Containerfile
            image: gateway
          - service: WebUI
            file: WebUI/Containerfile
            image: ecommerce-web-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: image-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ steps.image-owner.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}

  deployment-gate:
    name: Check Kubernetes deployment configuration
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}

    steps:
      - name: Check KUBE_CONFIG secret
        id: check
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG is not configured; Kubernetes deployment will be skipped."
          fi

  deploy-kubernetes:
    name: Deploy to Kubernetes
    if: needs.deployment-gate.outputs.enabled == 'true'
    needs: [docker-publish, deployment-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update manifest image tags
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          export OWNER="${OWNER,,}"
          python - <<'PY'
          import os
          from pathlib import Path

          owner = os.environ["OWNER"]
          sha = os.environ["SHA"]
          path = Path('k8s/microservices.yaml')
          text = path.read_text()
          replacements = {
              'localhost/product-service:1.0': f'ghcr.io/{owner}/product-service:{sha}',
              'localhost/order-service:1.0': f'ghcr.io/{owner}/order-service:{sha}',
              'localhost/user-service:1.0': f'ghcr.io/{owner}/user-service:{sha}',
              'localhost/payment-service:1.0': f'ghcr.io/{owner}/payment-service:{sha}',
              'localhost/gateway:1.0': f'ghcr.io/{owner}/gateway:{sha}',
              'localhost/ecommerce-web-ui:1.0': f'ghcr.io/{owner}/ecommerce-web-ui:{sha}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise ValueError(f'Expected image reference was not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Apply Kubernetes manifest
        run: kubectl apply -f k8s/microservices.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/product-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/order-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/user-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/payment-service -n ecommerce --timeout=180s
          kubectl rollout status deployment/gateway -n ecommerce --timeout=180s
           kubectl rollout status deployment/web-ui -n ecommerce --timeout=180s

      - name: Show deployment status
        run: kubectl get pods,services -n ecommerce
