apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-services
  namespace: ecommerce
data:
  Services__ProductServiceUrl: http://product-service
  Services__UserServiceUrl: http://user-service
  Services__PaymentServiceUrl: http://payment-service
  Frontend__AllowedOrigins__0: http://localhost:5173
  Frontend__AllowedOrigins__1: http://127.0.0.1:5173
  Monitoring__ProductServiceUrl: http://product-service
  Monitoring__OrderServiceUrl: http://order-service
  Monitoring__UserServiceUrl: http://user-service
  Monitoring__PaymentServiceUrl: http://payment-service
  ReverseProxy__Clusters__product-cluster__Destinations__product__Address: http://product-service/
  ReverseProxy__Clusters__order-cluster__Destinations__order__Address: http://order-service/
  ReverseProxy__Routes__order-hub-route__ClusterId: order-cluster
  ReverseProxy__Routes__order-hub-route__Match__Path: /hubs/orders/{**catch-all}
  ReverseProxy__Clusters__user-cluster__Destinations__user__Address: http://user-service/
  ReverseProxy__Clusters__payment-cluster__Destinations__payment__Address: http://payment-service/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: localhost/product-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: Authentication__SigningKey
              valueFrom:
                secretKeyRef:
                  name: ecommerce-auth
                  key: SigningKey
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db-connection-strings
                  key: ProductService
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      containers:
        - name: web-ui
          image: localhost/ecommerce-web-ui:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: web-ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
